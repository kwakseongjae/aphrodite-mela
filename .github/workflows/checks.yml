name: Checks

# Tests only ever ran when a tag was pushed, which means a broken commit sat on main until
# release day and the tag had to be moved. Everything that can be checked without a signing
# certificate runs here, on every push and every pull request.

on:
  push:
    branches: [main]
    paths-ignore: ["site/**", "docs/**", "**/*.md"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Two runners, one per architecture we ship. GitHub retired the macos-13 and macos-14 images
    # (by 2026-11 jobs on them were refused or sat queued forever), so the oldest macOS we promise in
    # tauri.conf.json is no longer something CI can run; macos-15-intel keeps the Intel build
    # executed. fail-fast is off so a break on one is not hidden by the other.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            triple: aarch64-apple-darwin
          - os: macos-15-intel
            triple: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Type check and bundle. `npm run build` is `tsc --noEmit` then vite, so a type error
      # fails here rather than at release time.
      - name: Build the frontend
        run: npm run build

      # Every edit lands in the ledger as exactly one change, named for whoever made it: each edit
      # row of the command table, on every surface it is offered on (0.3-2b). It drives the bundle
      # just built in the runner's Chrome, with trusted input for the person.
      - name: Check that the ledger names who made each edit
        run: npm run verify:ledger

      # A free page reaches nothing outside its frame: every request a page can make is aimed at a
      # server that only records, which must stay empty; the person's presses, drops and pastes on the
      # board, and a board of ten pages that selecting never loads again (0.3-P2). Same Chrome as above.
      - name: Check that a free page stays in its frame
        run: npm run verify:pages

      # The desktop's own wall (0.3-P2-fix3): two WebKit settings, measured against the review's attacks in
      # an off-screen WKWebView the runner's swiftc builds. Nothing it reaches is outside 127.0.0.1.
      - name: Check that WebKit keeps a free page off the network
        run: npm run verify:wall

      # The crate's build script wants the sidecar to exist before cargo runs, and it must be
      # built for the target cargo is about to use.
      - name: Build the Vision sidecar
        env:
          # Follows the runner rather than being written down: on the Intel image a sidecar built for
          # aarch64 is one cargo cannot link against, and the failure reads as a build-script bug.
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.triple }}
        run: node scripts/build-vision.mjs

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test
