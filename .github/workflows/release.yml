name: Release macOS build

# Builds a signed (and, when secrets are present, notarized) .dmg for Apple Silicon
# and attaches it to a GitHub Release. Trigger by pushing a tag like v0.1.0,
# or run manually with a tag name.
#
# Secrets (Settings → Secrets → Actions). All optional: without them the build is
# ad-hoc signed and users must right-click → Open on first launch.
#   APPLE_CERTIFICATE            base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD   password of that .p12
#   APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: Kwak Seongjae (YWQQFQM38J)"
#   APPLE_ID                     Apple ID e-mail used for notarization
#   APPLE_PASSWORD               app-specific password for that Apple ID
#   APPLE_TEAM_ID                e.g. YWQQFQM38J
#   or, instead of APPLE_ID/APPLE_PASSWORD: APPLE_API_ISSUER, APPLE_API_KEY (key id) and
#   APPLE_API_KEY_CONTENT (base64 of the AuthKey .p8) — set by `scripts/apple-signing-secrets.sh --api-key`

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            label: Apple Silicon
          - target: x86_64-apple-darwin
            label: Intel
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Tauri treats a *defined but empty* APPLE_CERTIFICATE as a certificate to import,
      # so the signed and unsigned paths are separate steps: the APPLE_* variables only
      # exist in the signed one.
      # Tauri treats a *defined but empty* APPLE_* variable as a real setting, so each
      # signing path is its own step and only defines the variables it uses.
      - name: Detect signing secrets
        id: signing
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          API_KEY: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          if [ -z "$CERT" ]; then echo "mode=unsigned" >> "$GITHUB_OUTPUT";
          elif [ -n "$API_KEY" ]; then echo "mode=apikey" >> "$GITHUB_OUTPUT";
          else echo "mode=appleid" >> "$GITHUB_OUTPUT"; fi

      - name: Write App Store Connect API key
        if: steps.signing.outputs.mode == 'apikey'
        env:
          API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          echo "$API_KEY_CONTENT" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build and publish release (signed, notarized with API key)
        if: steps.signing.outputs.mode == 'apikey'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: "Aphrodite ${{ env.TAG }}"
          releaseBody: "Aphrodite for macOS. Apple Silicon: Aphrodite_<version>_aarch64.dmg · Intel: Aphrodite_<version>_x64.dmg. Download, drag Aphrodite to Applications, open it."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --bundles dmg

      - name: Build and publish release (signed, notarized with Apple ID)
        if: steps.signing.outputs.mode == 'appleid'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: "Aphrodite ${{ env.TAG }}"
          releaseBody: "Aphrodite for macOS. Apple Silicon: Aphrodite_<version>_aarch64.dmg · Intel: Aphrodite_<version>_x64.dmg. Download, drag Aphrodite to Applications, open it."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --bundles dmg

      # tauri-action notarizes and staples the .app, but not the .dmg container. Gatekeeper
      # evaluates the DMG first when a user double-clicks the download, so notarize + staple it
      # too and replace the uploaded asset.
      - name: Notarize and staple the DMG (API key)
        if: steps.signing.outputs.mode == 'apikey'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          DMG="$(ls src-tauri/target/$TARGET/release/bundle/dmg/*.dmg | head -1)"
          xcrun notarytool submit "$DMG" --wait --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER"
          xcrun stapler staple "$DMG" && xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature -v "$DMG"
          gh release upload "$TAG" "$DMG" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Notarize and staple the DMG (Apple ID)
        if: steps.signing.outputs.mode == 'appleid'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          DMG="$(ls src-tauri/target/$TARGET/release/bundle/dmg/*.dmg | head -1)"
          xcrun notarytool submit "$DMG" --wait --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID"
          xcrun stapler staple "$DMG" && xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature -v "$DMG"
          gh release upload "$TAG" "$DMG" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Build and publish release (unsigned, ad-hoc)
        if: steps.signing.outputs.mode == 'unsigned'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: "Aphrodite ${{ env.TAG }}"
          releaseBody: "Aphrodite for macOS (Apple Silicon and Intel). Unsigned test build: right-click the app and choose Open on first launch."
          releaseDraft: true
          prerelease: true
          args: --target ${{ matrix.target }} --bundles dmg
