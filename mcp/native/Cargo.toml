[package]
name = "aphrodite-mcp"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
libc = "0.2"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "raw_value"] }
ureq = { version = "2.12", default-features = false }
ryu-js = "1"

[profile.release]
strip = true
lto = true
opt-level = "s"
panic = "abort"
