[package]
name = "aphrodite-mela"
version = "0.2.2"
description = "A computer-use friendly design workbench"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["webview-data-url"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
fs2 = "0.4"
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["tls"] }
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
objc2-web-kit = "0.3"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
block2 = "0.6"
