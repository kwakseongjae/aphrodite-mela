[package]
name = "aphrodite-mela"
version = "0.2.8"
description = "A computer-use friendly design workbench"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["webview-data-url", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
fs2 = "0.4"
libc = "0.2"
cap-std = "4"
rustix = { version = "1", features = ["fs"] }
uuid = { version = "1", features = ["v4"] }
xattr = "1"
toml_edit = "0.22"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
jsonc-parser = "0.34"
plist = "1"
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["tls"] }
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"

[target."cfg(target_os = \"macos\")".dependencies]
core-foundation = "0.10"
objc2 = "0.6"
objc2-web-kit = "0.3"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
block2 = "0.6"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
